  <rect x="11" y="10.8" width="42" height="30.4" rx="15.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.4"/>
  <!-- Plump Anime Heart inside bubble -->
  <path d="M32 36.8 C30.5 35.5, 19.5 27.6, 19.5 20.8 C19.5 16.5, 23.0 13.8, 26.8 13.8 C29.3 13.8, 31.1 15.1, 32 17.0 C32.9 15.1, 34.7 13.8, 37.2 13.8 C41.0 13.8, 44.5 16.5, 44.5 20.8 C44.5 27.6, 33.5 35.5, 32 36.8 Z" fill="url(#heartGrad)" stroke="#593A27" stroke-width="2.1" stroke-linejoin="round"/>
