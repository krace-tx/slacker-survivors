  <ellipse cx="25.6" cy="19.2" rx="2.7" ry="1.6" transform="rotate(-28 25.6 19.2)" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="46.5" cy="16.5" r="2.1" fill="#F5CA69" stroke="#593A27" stroke-width="1.2"/>
