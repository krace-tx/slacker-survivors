<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFEFA"/>
      <stop offset="100%" stop-color="#FCECD8"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9EA7"/>
      <stop offset="100%" stop-color="#EE7483"/>
    </linearGradient>
  </defs>
  <!-- Soft warm shadow -->
  <ellipse cx="33" cy="29" rx="24" ry="19" fill="#593A27" fill-opacity="0.16"/>
  <!-- Cute thought-cloud tail puffs -->
  <circle cx="25" cy="57" r="3.2" fill="#FFFDF8" stroke="#593A27" stroke-width="2"/>
  <circle cx="29.5" cy="49.5" r="5.0" fill="#FFFDF8" stroke="#593A27" stroke-width="2"/>
