<svg xmlns="http://www.w3.org/2000/svg" width="96" height="44" viewBox="0 0 96 44">
  <defs>
    <linearGradient id="pillHov" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF2" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FCE7B9" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <!-- Soft drop shadow -->
  <rect x="3" y="5" width="90" height="37" rx="18.5" fill="#5A3925" fill-opacity="0.18"/>
  <!-- Warm brass bottom lip -->
  <rect x="2.5" y="4.5" width="90" height="36" rx="18" fill="#DFAA50" stroke="#593A27" stroke-width="2.0"/>
  <!-- Sunlit butter-cream top face -->
  <rect x="2.5" y="2.2" width="90" height="33.8" rx="16.9" fill="url(#pillHov)" stroke="#593A27" stroke-width="2.0"/>
  <!-- Bright inner highlight -->
  <rect x="4.5" y="4.0" width="86" height="30" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.2"/>
</svg>
