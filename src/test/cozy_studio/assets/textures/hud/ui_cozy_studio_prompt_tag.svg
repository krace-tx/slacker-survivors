<svg xmlns="http://www.w3.org/2000/svg" width="128" height="48" viewBox="0 0 128 48">
  <defs>
    <linearGradient id="promptFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FBEAD0" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <!-- Warm soft caramel drop shadow -->
  <rect x="4" y="6" width="120" height="39" rx="19.5" fill="#593A27" fill-opacity="0.18"/>
  <!-- Honey-oak tactile bottom lip -->
  <rect x="3" y="4.5" width="120" height="38" rx="19" fill="#D9A66E" stroke="#593A27" stroke-width="2"/>
  <!-- Cream stationery pill face -->
  <rect x="3" y="2.5" width="120" height="35" rx="17.5" fill="url(#promptFill)" stroke="#593A27" stroke-width="2"/>
  <!-- Inner white gloss highlight -->
  <rect x="5.2" y="4.6" width="115.6" height="30.8" rx="15.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.2"/>
  <!-- Delicate journal stitch line -->
  <rect x="8" y="7" width="110" height="26" rx="13" fill="none" stroke="#D9B78F" stroke-width="1.1" stroke-dasharray="4.5 3.2" stroke-linecap="round"/>
</svg>
