<svg xmlns="http://www.w3.org/2000/svg" width="96" height="44" viewBox="0 0 96 44">
  <defs>
    <linearGradient id="pillNorm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#F6E6CE" stop-opacity="0.96"/>
    </linearGradient>
  </defs>
  <!-- Soft drop shadow -->
  <rect x="3" y="5" width="90" height="37" rx="18.5" fill="#5A3925" fill-opacity="0.15"/>
  <!-- Tactile honey-oak bottom lip -->
  <rect x="2.5" y="4.5" width="90" height="36" rx="18" fill="#D5A36F" stroke="#593A27" stroke-width="1.9"/>
  <!-- Cream enamel pill top face -->
  <rect x="2.5" y="2.5" width="90" height="33.5" rx="16.75" fill="url(#pillNorm)" stroke="#593A27" stroke-width="1.9"/>
  <!-- Subtle inner cream highlight -->
  <rect x="4.5" y="4.3" width="86" height="29.5" rx="14.75" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.1"/>
</svg>
