plugins {
    id 'com.android.library'
}

android {
    namespace 'org.godotengine.plugin.android.videoplayer'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Godot Android Library 依赖 (由导出系统提供)
    compileOnly "org.godotengine:godot:4.3.0.stable"
    // 仅用于编译期的空值注解（Godot AAR 不会暴露 androidx.annotation）。
    compileOnly "androidx.annotation:annotation:1.7.1"
    
    // AndroidX Media3 ExoPlayer 官方开源硬解媒体库
    implementation "androidx.media3:media3-exoplayer:1.2.0"
    implementation "androidx.media3:media3-ui:1.2.0"
}
