[project]
name = "blender-mcp"
version = "0.1.0"
description = "A game-asset-pipeline-oriented Blender MCP server for AI-assisted 3D modeling"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
blender-mcp = "blender_mcp.server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_mcp"]
